connectors:
  Can0:
    type: M12-5
    subtype: female
    pinlabels: [Wake-up, On/Off, Gnd, CAN High, CAN Low]
    image:
      src: m12-5.png

  Can1:
    type: M12-5
    subtype: female
    pinlabels: [Wake-up, On/Off, Gnd, CAN High, CAN Low]
    image:
      src: m12-5.png

  Can2:
    type: M12-5
    subtype: female
    pinlabels: [Wake-up, On/Off, Gnd, CAN High, CAN Low]
    image:
      src: m12-5.png

  IgnitionSwitch:
    type: rocker
    pinlabels: [On/Off, Gnd]
    image:
      src: rocker-switch.png

  WagoOnOff:
    type: Wago
    subtype: female
    pincount: 4

  WagoGround:
    type: Wago
    subtype: female
    pincount: 4

  WagoCanHigh:
    type: Wago
    subtype: female
    pincount: 3

  WagoCanLow:
    type: Wago
    subtype: female
    pincount: 3

cables:

  Can0Wire:
    colors: [BN, YE, BK, GN, WH]
    wirecount: 5 # need to specify number of wires explicitly when using a color code
    gauge: 24 awg # accepts AWG or mm2 as unit
    show_equiv: true # auto-calculate AWG equivalent from metric gauge
    length: 10 cm
    shield: false
    #type: Serial

  Can1Wire:
    colors: [BN, YE, BK, GN, WH]
    wirecount: 5 # need to specify number of wires explicitly when using a color code
    gauge: 24 awg
    show_equiv: true # auto-calculate AWG equivalent from metric gauge
    length: 10 cm
    shield: false
    #type: Serial

  Can2Wire:
    colors: [BN, YE, BK, GN, WH]
    wirecount: 5 # need to specify number of wires explicitly when using a color code
    gauge: 24 awg
    show_equiv: true # auto-calculate AWG equivalent from metric gauge
    length: 10 cm
    shield: false
    #type: Serial

  IgnitionSwitchWire:
    colors: [YE, BK]
    gauge: 24 awg
    show_equiv: true # auto-calculate AWG equivalent from metric gauge
    length: 10 cm
    shield: false
    #type: Serial

connections:

  -
    - Can0: On/Off
    - Can0Wire: 2
    - WagoOnOff: 1
  -
    - Can1: On/Off
    - Can1Wire: 2
    - WagoOnOff: 2
  -
    - Can2: 2
    - Can2Wire: 2
    - WagoOnOff: 3
  -
    - IgnitionSwitch: On/Off
    - IgnitionSwitchWire: 1
    - WagoOnOff: 4

  -
    - Can0: 3
    - Can0Wire: 3
    - WagoGround: 1
  -
    - Can1: 3
    - Can1Wire: 3
    - WagoGround: 2
  -
    - Can2: 3
    - Can2Wire: 3
    - WagoGround: 3
  -
    - IgnitionSwitch: Gnd
    - IgnitionSwitchWire: 2
    - WagoGround: 4

  -
    - Can0: 4
    - Can0Wire: 4
    - WagoCanHigh: 1
  -
    - Can1: 4
    - Can1Wire: 4
    - WagoCanHigh: 2
  -
    - Can2: 4
    - Can2Wire: 4
    - WagoCanHigh: 3

  -
    - Can0: 5
    - Can0Wire: 5
    - WagoCanLow: 1
  -
    - Can1: 5
    - Can1Wire: 5
    - WagoCanLow: 2
  -
    - Can2: 5
    - Can2Wire: 5
    - WagoCanLow: 3
